<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlameCine</title>
</head>
<body>
    <nav>
        <h1>BlameCine</h1>
    </nav>
    <div class="grid-global">

        <header class="banner-principal">
            <div class="banner-conteudo">
                <span class="banner-tag">Destaque da Semana</span>
                <h2 class="banner-titulo">Interestelar</h2>
                <p class="banner-descricao">As reservas de recursos da Terra estão escassas. Um grupo de astronautas recebe a missão de verificar planetas que possam receber a população mundial.</p>
            </div>
        </header>

        <!-- Grid de Filmes (Sub-grid) -->
        <main class="grid-filmes">
            <div class="card-filme"><img src="https://thumb.wikimedia.org/wikipedia/pt/thumb/3/3a/Interstellar_Filme.png/250px-Interstellar_Filme.png?utm_source=pt.wikipedia.org&utm_campaign=parser&utm_content=thumbnail" alt="Filme 1"></div>
            <div class="card-filme"><img src="https://br.web.img3.acsta.net/pictures/19/04/26/17/30/2428965.jpg" alt="Filme 2"></div>
            <div class="card-filme"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSEmLUwcKg6stEueys-eMaqwxTIRb_52yVB8JHKoD8z1g&s=10" alt="Filme 3"></div>
            <div class="card-filme"><img src="https://ingresso-a.akamaihd.net/prd/img/movie/homem-aranha-um-novo-dia/257f9c31-7c31-4bfd-b903-2b398f4830dc.webp" alt="Filme 4"></div>
            <div class="card-filme"><img src="https://br.web.img3.acsta.net/medias/nmedia/18/91/79/19/20163665.jpg" alt="Filme 5"></div>
            <div class="card-filme"><img src="https://i.pinimg.com/736x/d1/ce/6e/d1ce6e5049b6b57f5a7c63dd7de2881a.jpg" alt="Filme 6"></div>
        </main>

    </div>
</body>
</html>
